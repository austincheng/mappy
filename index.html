<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Map of Us</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <link rel="stylesheet" href="css/happiano.css?v=8" />
</head>
<body>
  <!-- =========================================================
       PHASE 1: THE MAP (stylized, animated, offline)
       A glowing night-world map with twinkling points she clicks
       to open memories. No tiles, no route lines. When all points
       are discovered, the final "here" point reveals and hands off
       to the next phase.
       ========================================================= -->
  <canvas id="map"></canvas>

  <!-- Fixed title — pinned to the top of the screen, above the map -->
  <div id="map-title" class="map-title">World Map</div>

  <!-- Memory card that blooms when a point is clicked -->
  <div id="memory-card" class="memory-card hidden">
    <button id="memory-close" class="memory-close" aria-label="close">&times;</button>
    <div id="memory-slideshow" class="memory-slideshow">
      <img id="memory-photo-a" class="memory-photo slide" alt="" />
      <img id="memory-photo-b" class="memory-photo slide" alt="" />
    </div>
    <div class="memory-body">
      <div id="memory-place" class="memory-place"></div>
      <div id="memory-date" class="memory-date"></div>
      <div id="memory-note" class="memory-note"></div>
    </div>
  </div>

  <!-- Later phases (final pin / 夕 + heart / song / video / mosaic) mount here -->
  <div id="stage" class="stage hidden"></div>

  <!-- FINAL_PIN phase: the happiano page (夕 counter + heart + piano + text) -->
  <div id="happiano" class="hidden"></div>

  <!-- d3-array must load before d3-geo (geo reads it off the d3 global) -->
  <script src="libs/d3-array.min.js"></script>
  <script src="libs/d3-geo.min.js"></script>
  <script src="libs/audiosynth.js"></script>
  <script src="libs/mojscore.js"></script>
  <script src="js/places.js?v=7"></script>
  <script src="js/sequencer.js?v=2"></script>
  <script src="js/happiano.js?v=7"></script>
  <script src="js/map.js?v=37"></script>
</body>
</html>
